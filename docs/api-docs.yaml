components:
  securitySchemes:
    cookieAuth:
      in: cookie
      name: lo_access_token
      type: apiKey
info:
  description: Documentazione API per LightsOn
  title: LightsOn API
  version: 1.0.0
openapi: 3.0.0
paths:
  /all:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  reports:
                    items:
                      properties:
                        date:
                          format: date-time
                          type: string
                        description:
                          type: string
                        id:
                          type: string
                        lightId:
                          type: string
                        problemType:
                          type: string
                        producer:
                          properties:
                            name:
                              type: string
                            phone:
                              type: string
                          type: object
                        status:
                          type: string
                        upvoteCount:
                          type: integer
                      type: object
                    type: array
                type: object
          description: Lista di tutte le segnalazioni formattate
        '500':
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                type: object
          description: Errore del server
      summary: Recupera tutte le segnalazioni (admin)
      tags:
      - Admin
  /approve:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                reportId:
                  description: ID della segnalazione da approvare
                  type: string
              required:
              - reportId
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  approvedCounts:
                    type: integer
                  message:
                    type: string
                type: object
          description: Voto aggiunto con successo
        '400':
          content:
            application/json:
              schema:
                properties:
                  alreadyVoted:
                    type: boolean
                  message:
                    type: string
                type: object
          description: "reportId mancante o utente ha gi\xE0 votato"
        '404':
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                type: object
          description: Report non trovato
        '500':
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                type: object
          description: Errore del server
      security:
      - cookieAuth: []
      summary: Approva (vota) una segnalazione
      tags:
      - Reports
  /light/{lightId}:
    get:
      parameters:
      - description: ID del lampione
        in: path
        name: lightId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  activeReport:
                    oneOf:
                    - properties:
                        approvedCounts:
                          type: integer
                        description:
                          type: string
                        reportId:
                          type: string
                        state:
                          type: string
                      type: object
                    - type: 'null'
                type: object
          description: Dati della segnalazione attiva (o null se non presente)
        '404':
          content:
            application/json:
              schema:
                properties:
                  activeReport:
                    type: 'null'
                  message:
                    type: string
                type: object
          description: Lampione non trovato
        '500':
          content:
            application/json:
              schema:
                properties:
                  activeReport:
                    type: 'null'
                  message:
                    type: string
                type: object
          description: Errore del server
      summary: Recupera la segnalazione attiva di un lampione
      tags:
      - Reports
  /lights:
    get:
      parameters:
      - description: Latitudine minima del bounding box
        in: query
        name: minLat
        required: true
        schema:
          type: number
      - description: Latitudine massima del bounding box
        in: query
        name: maxLat
        required: true
        schema:
          type: number
      - description: Longitudine minima del bounding box
        in: query
        name: minLng
        required: true
        schema:
          type: number
      - description: Longitudine massima del bounding box
        in: query
        name: maxLng
        required: true
        schema:
          type: number
      - description: Livello di zoom (1, 2 o 3). Determina l'area effettiva e la fascia
          esterna da considerare.
        in: query
        name: step
        schema:
          default: '1'
          type: string
      - description: Identificativo della vista (utile per il frontend)
        in: query
        name: viewId
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  lights:
                    items:
                      properties:
                        approvedCounts:
                          description: Numero di segnalazioni approvate per questo
                            lampione
                          type: integer
                        id:
                          description: ID del lampione
                          type: string
                        position:
                          description: Coordinate [latitudine, longitudine]
                          items:
                            type: number
                          type: array
                      type: object
                    type: array
                  step:
                    description: Livello di zoom convertito in intero
                    type: integer
                  viewId:
                    description: Identificativo della vista passato come parametro
                    type: string
                type: object
          description: Lista di lampioni nell'area richiesta
        '500':
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                type: object
          description: Errore del server
      summary: Recupera i lampioni in base alla viewport e al livello di zoom (step)
      tags:
      - Lights
  /lights/age:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  properties:
                    age:
                      description: "Et\xE0 in anni (approssimata a un decimale) o\
                        \ null se data mancante"
                      nullable: true
                      type: number
                    coordinates:
                      description: Coordinate geografiche [longitudine, latitudine]
                      items:
                        type: number
                      type: array
                    id:
                      description: ID del lampione
                      type: string
                    installationDate:
                      description: Data di installazione
                      format: date
                      type: string
                    manufacturer:
                      description: Produttore del lampione
                      type: string
                  type: object
                type: array
          description: "Lista di lampioni con et\xE0 calcolata, ordinati per et\xE0\
            \ decrescente"
        '500':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                type: object
          description: Errore del server
      summary: "Calcola l'et\xE0 di ogni lampione in base alla data di installazione"
      tags:
      - Lights
  /lights/stats:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  active:
                    description: Numero di lampioni attivi (senza segnalazioni attive)
                    type: integer
                  inactive:
                    description: Numero di lampioni inattivi (con segnalazione attiva)
                    type: integer
                  interventions:
                    description: Interventi in corso o in attesa
                    items:
                      properties:
                        description:
                          description: Descrizione della segnalazione
                          type: string
                        lightId:
                          description: ID del lampione
                          type: string
                        reportId:
                          description: ID della segnalazione
                          type: string
                        status:
                          description: Stato della segnalazione
                          enum:
                          - pending
                          - working on
                          type: string
                      type: object
                    type: array
                  total:
                    description: Numero totale di lampioni
                    type: integer
                type: object
          description: Oggetto con statistiche e interventi
        '500':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                type: object
          description: Errore del server
      summary: Statistiche globali dei lampioni (attivi, inattivi, interventi in corso)
      tags:
      - Lights
  /login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  format: email
                  type: string
                password:
                  type: string
              required:
              - email
              - password
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  msg:
                    type: string
                  role:
                    type: string
                type: object
          description: Login riuscito, token JWT nel cookie
        '400':
          content:
            application/json:
              schema:
                properties:
                  msg:
                    type: string
                type: object
          description: Credenziali errate
        '500':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                type: object
          description: Errore del server
      summary: Login utente
      tags:
      - Auth
  /logout:
    post:
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  msg:
                    type: string
                type: object
          description: Logout effettuato con successo
        '500':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                type: object
          description: Errore del server
      summary: Logout (rimuove il cookie di accesso)
      tags:
      - Auth
  /me:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  email:
                    format: email
                    type: string
                  profile:
                    properties:
                      firstName:
                        type: string
                      lastName:
                        type: string
                    type: object
                  role:
                    type: string
                  userId:
                    type: string
                type: object
          description: Dati utente
        '401':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                type: object
          description: Non autenticato
        '404':
          content:
            application/json:
              schema:
                properties:
                  msg:
                    type: string
                type: object
          description: Utente non trovato
        '500':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                type: object
          description: Errore del server
      security:
      - cookieAuth: []
      summary: Restituisce il ruolo dell'utente autenticato
      tags:
      - Auth
  /new_report:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  type: string
                lightId:
                  type: string
                malfunctionType:
                  type: string
                userId:
                  type: string
              required:
              - lightId
              - userId
              - description
              - malfunctionType
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                  reportId:
                    type: string
                type: object
          description: Report creato con successo
        '500':
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                type: object
          description: Errore del server
      summary: Crea una nuova segnalazione per un lampione
      tags:
      - Reports
  /signup:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  format: email
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                password:
                  minLength: 8
                  type: string
              required:
              - email
              - password
              - firstName
              - lastName
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  msg:
                    type: string
                  role:
                    type: string
                type: object
          description: Utente creato con successo, token JWT nel cookie
        '400':
          content:
            application/json:
              schema:
                properties:
                  msg:
                    type: string
                type: object
          description: "Campi mancanti o email gi\xE0 esistente"
        '500':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                type: object
          description: Errore del server
      summary: Registrazione nuovo utente
      tags:
      - Auth
  /status:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                reportId:
                  type: string
                status:
                  enum:
                  - pending
                  - working on
                  - resolved
                  type: string
              required:
              - reportId
              - status
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                  status:
                    type: string
                type: object
          description: Stato aggiornato con successo
        '400':
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                type: object
          description: Valore di stato non valido
        '404':
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                type: object
          description: Report non trovato
        '500':
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                type: object
          description: Errore del server
      summary: Aggiorna lo stato di una segnalazione (admin)
      tags:
      - Admin
servers:
- description: Server di sviluppo
  url: http://localhost:5000
tags: []
